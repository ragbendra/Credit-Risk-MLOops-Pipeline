# CI/CD Pipeline for Credit Risk MLOps
# 
# Triggers:
# - On pull request to main: Run linting and tests
# - On push to main: Run tests and deploy to Render
#
# Secrets required:
# - RENDER_DEPLOY_HOOK: Render deploy webhook URL

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================
  # Linting and Code Quality
  # ===========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check src/ --output-format=github

  # ===========================================
  # Unit and Integration Tests
  # ===========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Download test data
        run: python src/data/download.py

      - name: Preprocess data
        run: python src/data/preprocess.py

      - name: Train model (without MLflow server)
        run: |
          # Patch to skip MLflow
          sed -i 's/use_mlflow=True/use_mlflow=False/' src/models/train.py
          python src/models/train.py

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================
  # Deploy to Render (on push to main only)
  # ===========================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Notify success
        run: echo "🚀 Deployment triggered successfully!"
